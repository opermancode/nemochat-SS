<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NemoChat | Secure Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        .glass { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); }
        .msg-appear { animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex overflow-hidden">

    <div class="w-80 border-r border-zinc-800 bg-zinc-900/50 flex flex-col">
        <div class="p-6">
            <h1 class="text-xl font-bold text-emerald-500 mb-4 tracking-tight">NemoChat.</h1>
            <div class="relative">
                <input id="search-bar" oninput="searchUsers()" placeholder="Search global users..." 
                       class="w-full bg-zinc-800/50 border border-zinc-700 p-2.5 rounded-lg text-sm focus:border-emerald-500 outline-none transition-all">
            </div>
        </div>

        <div id="results-area" class="flex-1 overflow-y-auto px-4 space-y-2">
            </div>

        <div class="p-4 border-t border-zinc-800 bg-zinc-900/20">
            <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-3 px-2">Pending Invitations</h3>
            <div id="request-area" class="space-y-2"></div>
        </div>
    </div>

    <div class="flex-1 flex flex-col bg-zinc-950 relative">
        <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/5 blur-[100px] -z-10"></div>
        
        <div id="chat-header" class="p-4 border-b border-zinc-800 flex items-center justify-between glass z-10">
            <div class="flex items-center gap-3">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-zinc-700"></div>
                <span id="active-user-name" class="font-semibold text-zinc-400">Select a tunnel to begin</span>
            </div>
            <button onclick="logout()" class="text-xs font-bold text-zinc-500 hover:text-red-400 transition-colors uppercase tracking-wider">Terminate Session</button>
        </div>

        <div id="messages-container" class="flex-1 p-6 overflow-y-auto space-y-4">
            <div class="h-full flex flex-col items-center justify-center text-zinc-700 space-y-4">
                <div class="w-12 h-12 border-2 border-zinc-800 rounded-full flex items-center justify-center">
                    <span class="text-xl">🔒</span>
                </div>
                <p class="text-sm">End-to-End Relay active. Select a user to establish a tunnel.</p>
            </div>
        </div>

        <div class="p-4 bg-zinc-900/50 border-t border-zinc-800 glass">
            <div class="flex gap-4 max-w-4xl mx-auto">
                <input id="msg-input" autocomplete="off" placeholder="Type a secure message..." 
                       class="flex-1 bg-zinc-800/80 border border-zinc-700 p-3 rounded-xl outline-none focus:border-emerald-500 transition-all text-sm">
                <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-bold transition-all shadow-lg shadow-emerald-900/20">
                    Send
                </button>
            </div>
            <p class="text-[9px] text-center text-zinc-600 mt-2 uppercase tracking-[0.2em]">Ephemeral Session: Messages vanish on disconnect</p>
        </div>
    </div>

    <script>
        const socket = io();
        const myId = localStorage.getItem('userId');
        const myName = localStorage.getItem('username');
        let activePeerId = null;

        if (!myId) window.location.href = '/';

        // 1. Initialize
        socket.emit('register_online', myId);
        loadFriends();

        // 2. Load Permanent Friends
        async function loadFriends() {
            try {
                const res = await fetch(`/api/friends/${myId}`);
                const friends = await res.json();
                const area = document.getElementById('results-area');
                
                if (document.getElementById('search-bar').value) return;

                area.innerHTML = '<h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 px-3">Your Tunnels</h3>';
                
                if (friends.length === 0) {
                    area.innerHTML += '<p class="text-[11px] text-zinc-600 px-3 italic">No active tunnels found.</p>';
                }

                friends.forEach(f => {
                    const isActive = activePeerId == f.id;
                    const div = document.createElement('div');
                    div.className = `flex justify-between items-center p-3 rounded-lg transition-all cursor-pointer border ${isActive ? 'bg-emerald-500/10 border-emerald-500/30' : 'hover:bg-zinc-800 border-transparent'} mb-1`;
                    div.onclick = () => selectPeer(f.id, f.username);
                    div.innerHTML = `
                        <span class="text-sm font-medium ${isActive ? 'text-emerald-400' : 'text-zinc-300'}">${f.username}</span>
                        <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></div>
                    `;
                    area.appendChild(div);
                });
            } catch (err) { console.error("Entity load failed", err); }
        }

        // 3. Global Discovery
        async function searchUsers() {
            const q = document.getElementById('search-bar').value;
            if (!q) return loadFriends(); 
            
            const res = await fetch(`/api/users/search?q=${q}&currentId=${myId}`);
            const users = await res.json();
            const area = document.getElementById('results-area');
            
            area.innerHTML = '<h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 px-3">Global Discovery</h3>';
            area.innerHTML += users.map(u => `
                <div class="flex justify-between items-center p-3 hover:bg-zinc-800 rounded-lg transition-colors group">
                    <span class="text-sm font-medium">${u.username}</span>
                    <button onclick="sendRequest(${u.id}, '${u.username}')" class="text-emerald-500 opacity-0 group-hover:opacity-100 text-[10px] font-bold tracking-tighter transition-all">INVITE</button>
                </div>
            `).join('');
        }

        // 4. Request Logic
        function sendRequest(toId, toName) {
            socket.emit('send_request', { fromId: myId, toId, fromName: myName });
            alert(`Signal sent to ${toName}`);
        }

        socket.on('new_request', (data) => {
            const area = document.getElementById('request-area');
            if (document.getElementById(`req-${data.fromId}`)) return;

            const div = document.createElement('div');
            div.id = `req-${data.fromId}`;
            div.className = "p-3 bg-emerald-500/5 border border-emerald-500/10 rounded-lg text-sm flex justify-between items-center animate-pulse";
            div.innerHTML = `
                <span class="text-zinc-300 font-medium">${data.fromName}</span>
                <button onclick="acceptChat(${data.fromId}, '${data.fromName}')" class="text-emerald-400 text-xs font-bold hover:text-emerald-300 transition-colors">ACCEPT</button>
            `;
            area.appendChild(div);
        });

        function acceptChat(id, name) {
            socket.emit('accept_chat', { myId, myName, peerId: id });
            const reqEl = document.getElementById(`req-${id}`);
            if (reqEl) reqEl.remove();
            
            // FIX: Immediately establish the local tunnel
            selectPeer(id, name);
            setTimeout(loadFriends, 500);
        }

        socket.on('request_accepted', (data) => {
            loadFriends(); // Refresh list when remote side accepts
        });

        // 5. Messaging Fixes
        function selectPeer(id, name) {
            activePeerId = id;
            document.getElementById('active-user-name').innerText = `Direct Tunnel: ${name}`;
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            loadHistory();
            loadFriends(); // Refresh sidebar to show active state
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!activePeerId || !text) return;

            socket.emit('private_message', { toId: activePeerId, fromId: myId, message: text });
            saveAndRender(activePeerId, 'me', text);
            input.value = '';
        }

        // Listen for Enter Key
        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('receive_message', (data) => {
            saveAndRender(data.fromId, 'them', data.message);
            // If message is from someone not currently open, refresh list to show activity
            if (activePeerId != data.fromId) loadFriends();
        });

        function saveAndRender(peerId, sender, text) {
            const key = `chat_log_${peerId}`;
            const history = JSON.parse(sessionStorage.getItem(key) || "[]");
            history.push({ sender, text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            sessionStorage.setItem(key, JSON.stringify(history));
            
            if (activePeerId == peerId) loadHistory();
        }

        function loadHistory() {
            const key = `chat_log_${activePeerId}`;
            const history = JSON.parse(sessionStorage.getItem(key) || "[]");
            const container = document.getElementById('messages-container');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="h-full flex items-center justify-center text-zinc-600 text-xs italic">Tunnel Secure. No session logs found.</div>';
                return;
            }

            container.innerHTML = history.map(m => `
                <div class="flex ${m.sender === 'me' ? 'justify-end' : 'justify-start'} msg-appear">
                    <div class="max-w-[75%] ${m.sender === 'me' ? 'bg-emerald-600 text-white' : 'bg-zinc-800 text-zinc-200'} p-3 rounded-2xl shadow-lg border border-white/5">
                        <p class="text-sm leading-relaxed">${m.text}</p>
                        <span class="text-[8px] opacity-50 mt-1 block text-right">${m.time}</span>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
